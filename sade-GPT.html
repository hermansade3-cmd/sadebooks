<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SadeGPT — SadeBooks AI</title>

<meta name="description"
content="SadeGPT — AI assistant wa SadeBooks. Uliza kuhusu vitabu, waandishi, categories, huduma na maudhui ya SadeBooks.">

<style>
:root{
    --bg:#f5f7fb;
    --card:#ffffff;
    --text:#172033;
    --muted:#6b7280;
    --primary:#6d28d9;
    --primary2:#8b5cf6;
    --border:#e5e7eb;
    --user:#6d28d9;
    --assistant:#ffffff;
    --danger:#dc2626;
    --success:#16a34a;
    --shadow:0 10px 35px rgba(0,0,0,.08);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
}

body{
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

/* APP */

.app{
    height:100vh;
    display:flex;
    overflow:hidden;
}

/* SIDEBAR */

.sidebar{
    width:285px;
    background:#111827;
    color:white;
    display:flex;
    flex-direction:column;
    border-right:1px solid rgba(255,255,255,.08);
    z-index:20;
}

.brand{
    padding:20px;
    display:flex;
    align-items:center;
    gap:12px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    width:44px;
    height:44px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#8b5cf6,#4f46e5);
    font-size:22px;
    box-shadow:0 8px 25px rgba(139,92,246,.35);
}

.brand h1{
    font-size:19px;
}

.brand small{
    color:#a5b4fc;
    display:block;
    margin-top:2px;
}

.new-chat{
    margin:18px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.07);
    color:white;
    border-radius:12px;
    padding:13px;
    display:flex;
    justify-content:center;
    gap:8px;
    transition:.2s;
}

.new-chat:hover{
    background:rgba(255,255,255,.14);
}

.side-title{
    padding:0 18px 10px;
    color:#9ca3af;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
}

.history{
    flex:1;
    overflow-y:auto;
    padding:0 10px;
}

.history-item{
    padding:11px 12px;
    border-radius:10px;
    margin-bottom:4px;
    color:#d1d5db;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.history-item:hover{
    background:rgba(255,255,255,.07);
}

.sidebar-bottom{
    padding:14px;
    border-top:1px solid rgba(255,255,255,.08);
}

.side-button{
    width:100%;
    background:transparent;
    color:#d1d5db;
    border:0;
    text-align:left;
    padding:11px;
    border-radius:10px;
    margin-bottom:4px;
}

.side-button:hover{
    background:rgba(255,255,255,.07);
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

/* HEADER */

.header{
    height:68px;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    z-index:10;
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.mobile-menu{
    display:none;
    border:0;
    background:transparent;
    font-size:23px;
}

.header-title{
    font-weight:700;
}

.status{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--muted);
    font-size:13px;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--success);
}

.status-dot.offline{
    background:#ef4444;
}

.header-actions{
    display:flex;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    background:white;
    border-radius:11px;
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:35px 20px 150px;
}

.chat-inner{
    max-width:900px;
    margin:auto;
}

.welcome{
    text-align:center;
    margin:50px auto 35px;
    max-width:700px;
}

.welcome-logo{
    width:75px;
    height:75px;
    border-radius:25px;
    background:linear-gradient(135deg,#7c3aed,#4f46e5);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    margin:auto auto 20px;
    box-shadow:0 15px 45px rgba(79,70,229,.25);
}

.welcome h2{
    font-size:32px;
    margin-bottom:10px;
}

.welcome p{
    color:var(--muted);
    line-height:1.7;
}

.suggestions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:25px;
}

.suggestion{
    padding:14px;
    border:1px solid var(--border);
    background:white;
    border-radius:14px;
    text-align:left;
    transition:.2s;
}

.suggestion:hover{
    border-color:var(--primary2);
    transform:translateY(-2px);
}

/* MESSAGE */

.message{
    display:flex;
    gap:12px;
    margin:25px 0;
}

.message.user{
    justify-content:flex-end;
}

.avatar{
    width:38px;
    height:38px;
    min-width:38px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#7c3aed,#4f46e5);
    color:white;
}

.user .avatar{
    order:2;
    background:#111827;
}

.bubble{
    max-width:78%;
    padding:14px 17px;
    border-radius:17px;
    line-height:1.65;
    box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.assistant .bubble{
    background:white;
    border:1px solid var(--border);
    border-top-left-radius:5px;
}

.user .bubble{
    background:var(--user);
    color:white;
    border-top-right-radius:5px;
}

.message-tools{
    margin-top:8px;
    display:flex;
    gap:5px;
}

.message-tools button{
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:12px;
}

/* BOOK CARD */

.book-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:12px;
    margin-top:15px;
}

.book-card{
    border:1px solid var(--border);
    border-radius:15px;
    overflow:hidden;
    background:white;
}

.book-image{
    width:100%;
    height:145px;
    object-fit:cover;
    background:#f3f4f6;
}

.book-body{
    padding:13px;
}

.book-category{
    font-size:11px;
    color:var(--primary);
    font-weight:700;
    margin-bottom:4px;
}

.book-title{
    font-weight:700;
    margin-bottom:7px;
}

.book-description{
    font-size:13px;
    color:var(--muted);
    line-height:1.5;
}

.book-price{
    font-weight:800;
    margin:10px 0;
}

.book-link{
    display:block;
    text-align:center;
    padding:9px;
    border-radius:9px;
    background:var(--primary);
    color:white;
    text-decoration:none;
    font-size:13px;
}

/* INPUT */

.composer-area{
    position:fixed;
    bottom:0;
    left:285px;
    right:0;
    padding:15px 20px 20px;
    background:linear-gradient(
        transparent,
        rgba(245,247,251,.95) 25%
    );
}

.composer{
    max-width:900px;
    margin:auto;
    background:white;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
    border-radius:20px;
    padding:10px;
}

textarea{
    width:100%;
    border:0;
    resize:none;
    outline:none;
    padding:8px 10px;
    min-height:45px;
    max-height:150px;
    color:var(--text);
}

.composer-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:5px;
}

.composer-left{
    display:flex;
    gap:5px;
}

.small-btn{
    border:0;
    background:#f3f4f6;
    padding:8px 10px;
    border-radius:9px;
    font-size:12px;
}

.send{
    width:43px;
    height:43px;
    border:0;
    border-radius:13px;
    color:white;
    background:linear-gradient(135deg,#7c3aed,#4f46e5);
}

/* SETTINGS MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:550px;
    border-radius:20px;
    padding:22px;
    max-height:90vh;
    overflow:auto;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.close{
    border:0;
    background:#f3f4f6;
    width:36px;
    height:36px;
    border-radius:10px;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.form-group input,
.form-group select{
    width:100%;
    padding:12px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
}

.save-settings{
    width:100%;
    border:0;
    background:var(--primary);
    color:white;
    padding:13px;
    border-radius:11px;
}

/* LOADING */

.typing{
    display:flex;
    gap:5px;
}

.typing span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#9ca3af;
    animation:bounce 1s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{
    0%,80%,100%{
        transform:translateY(0);
    }
    40%{
        transform:translateY(-5px);
    }
}

/* RESPONSIVE */

@media(max-width:800px){

    .sidebar{
        position:fixed;
        left:-290px;
        top:0;
        bottom:0;
        transition:.25s;
    }

    .sidebar.open{
        left:0;
    }

    .mobile-menu{
        display:block;
    }

    .composer-area{
        left:0;
        padding:10px;
    }

    .header{
        padding:0 12px;
    }

    .chat{
        padding:25px 12px 145px;
    }

    .welcome h2{
        font-size:25px;
    }

    .suggestions{
        grid-template-columns:1fr;
    }

    .bubble{
        max-width:88%;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

<!-- SETTINGS -->

            onclick="closeSettings()">
            ✕
        </button>

        <label>
            AI Provider
        </label>

        <select id="provider">

            <option value="mistral">

            id="sadeBooksUrl"
            value="https://hermansade3-cmd.github.io/sadebooks/">

        onclick="saveSettings()">
        💾 Save Settings

<script>

/* =========================================================
   SADEGPT — SADEBOOKS AI ENGINE
========================================================= */

const DEFAULT_SADEBOOKS =
    "https://hermansade3-cmd.github.io/sadebooks/";

let sadeBooksData = {
    books: [],
    categories: [],
    rawText: "",
    loaded: false,
    lastUpdated: null
};

let conversation = [];

let settings = {
    provider: "mistral",
    endpoint:
        "https://api.mistral.ai/v1/chat/completions",
    model:
        "mistral-small-latest",
    apiKey: "",
    sadeBooksUrl: DEFAULT_SADEBOOKS
};


/* =========================================================
   INITIALIZATION
========================================================= */

document.addEventListener("DOMContentLoaded", async () => {

    loadSettings();

    loadHistory();

    updateOnlineStatus();

    window.addEventListener(
        "online",
        updateOnlineStatus
    );

    window.addEventListener(
        "offline",
        updateOnlineStatus
    );

    await loadSadeBooks();

});


/* =========================================================
   SETTINGS
========================================================= */

function loadSettings(){

    try{

        const saved =
            localStorage.getItem("sadegpt_settings");

        if(saved){

            settings = {
                ...settings,
                ...JSON.parse(saved)
            };

        }

    }catch(e){

        console.error(e);

    }

    document.getElementById("provider").value =
        settings.provider;

    document.getElementById("endpoint").value =
        settings.endpoint;

    document.getElementById("model").value =
        settings.model;

    document.getElementById("apiKey").value =
        settings.apiKey;

    document.getElementById("sadeBooksUrl").value =
        settings.sadeBooksUrl;
}


function saveSettings(){

    settings.provider =
        document.getElementById("provider").value;

    settings.endpoint =
        document.getElementById("endpoint").value.trim();

    settings.model =
        document.getElementById("model").value.trim();

    settings.apiKey =
        document.getElementById("apiKey").value.trim();

    settings.sadeBooksUrl =
        document.getElementById("sadeBooksUrl").value.trim()
        || DEFAULT_SADEBOOKS;

    localStorage.setItem(
        "sadegpt_settings",
        JSON.stringify(settings)
    );

    closeSettings();

    loadSadeBooks();

    addAssistantMessage(
        "✅ Settings zimehifadhiwa. SadeGPT iko tayari kutumia taarifa za SadeBooks."
    );
}


/* =========================================================
   SADEBOOKS KNOWLEDGE ENGINE
========================================================= */

async function loadSadeBooks(){

    setStatus(
        "loading",
        "Inapakia SadeBooks..."
    );

    try{

        const response =
            await fetch(
                settings.sadeBooksUrl,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "SadeBooks HTTP " +
                response.status
            );

        }

        const html =
            await response.text();

        parseSadeBooks(html);

        sadeBooksData.loaded = true;

        sadeBooksData.lastUpdated =
            new Date().toISOString();

        localStorage.setItem(
            "sadegpt_sadebooks_cache",
            JSON.stringify(sadeBooksData)
        );

        setStatus(
            "online",
            `SadeBooks connected • ${sadeBooksData.books.length} books`
        );

    }catch(error){

        console.error(
            "SadeBooks loading error:",
            error
        );

        loadCachedSadeBooks();

        if(sadeBooksData.loaded){

            setStatus(
                "offline",
                "SadeBooks • Cached data"
            );

        }else{

            setStatus(
                "offline",
                "SadeBooks haijaunganishwa"
            );

        }

    }

}


function parseSadeBooks(html){

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );

    const text =
        doc.body
        ? doc.body.innerText
        : "";

    sadeBooksData.rawText =
        cleanText(text);

    const cards =
        findBookCards(doc);

    sadeBooksData.books =
        cards;

    sadeBooksData.categories =
        [...new Set(
            cards
                .map(b => b.category)
                .filter(Boolean)
        )];

}


function cleanText(text){

    return text
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================================
   BOOK DETECTION
========================================================= */

function findBookCards(doc){

    const results = [];

    const headings =
        [...doc.querySelectorAll(
            "h1,h2,h3,h4,h5,h6"
        )];

    headings.forEach(heading => {

        const title =
            cleanText(
                heading.textContent
            );

        if(!looksLikeBookTitle(title)){
            return;
        }

        let container =
            heading.closest(
                "article,.card,.book-card,[class*='book'],[class*='card']"
            );

        if(!container){

            container =
                heading.parentElement;

        }

        if(!container){
            return;
        }

        const containerText =
            cleanText(
                container.innerText
            );

        const link =
            [...container.querySelectorAll("a")]
                .find(a =>
                    a.href &&
                    (
                        /nunua/i.test(a.innerText) ||
                        /buy/i.test(a.innerText) ||
                        a.href !== settings.sadeBooksUrl
                    )
                );

        const image =
            container.querySelector("img");

        const category =
            extractCategory(containerText);

        const price =
            extractPrice(containerText);

        const description =
            extractDescription(
                containerText,
                title
            );

        const item = {
            title,
            category,
            price,
            description,
            url:
                link
                ? link.href
                : settings.sadeBooksUrl,
            image:
                image
                ? image.src
                : "",
            text:
                containerText
        };

        if(
            !results.some(
                b =>
                    normalize(b.title) ===
                    normalize(title)
            )
        ){

            results.push(item);

        }

    });

    return results;

}


function looksLikeBookTitle(title){

    if(!title){
        return false;
    }

    if(title.length < 4){
        return false;
    }

    const excluded = [
        "Sade Books",
        "Vitabu vya Kidigitali",
        "Karibu Sade Books",
        "Huduma Zetu Bora",
        "Kwa Nini Sisi",
        "Msaada",
        "Viungo",
        "SadeGPT",
        "About Us"
    ];

    if(excluded.includes(title)){
        return false;
    }

    return true;

}


function extractCategory(text){

    const known = [
        "Ujasiriamali",
        "Uzalishaji",
        "Chakula",
        "Forex",
        "Website",
        "Biashara",
        "Elimu",
        "Teknolojia",
        "Afya"
    ];

    for(const category of known){

        if(
            text
                .toLowerCase()
                .includes(
                    category.toLowerCase()
                )
        ){

            return category;

        }

    }

    return "";

}


function extractPrice(text){

    const match =
        text.match(
            /TSH\s*[\d,]+/i
        );

    return match
        ? match[0].toUpperCase()
        : "";

}


function extractDescription(
    text,
    title
){

    let result =
        text
            .replace(title,"")
            .replace(/TSH\s*[\d,]+/gi,"")
            .replace(/Nunua\s*→/gi,"")
            .trim();

    if(result.length > 300){

        result =
            result.substring(0,300) +
            "...";

    }

    return result;

}

/* =========================================================
   SEARCH ENGINE
========================================================= */

function normalize(value){

    return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


function searchBooks(query){

    const q =
        normalize(query);

    if(!q){
        return [];
    }

    const words =
        q
            .split(/\s+/)
            .filter(Boolean);

    const scored =
        sadeBooksData.books
        .map(book => {

            const haystack =
                normalize(
                    [
                        book.title,
                        book.category,
                        book.description,
                        book.text
                    ].join(" ")
                );

            let score = 0;

            words.forEach(word => {

                if(
                    normalize(book.title)
                        .includes(word)
                ){
                    score += 10;
                }

                if(
                    normalize(book.category)
                        .includes(word)
                ){
                    score += 7;
                }

                if(
                    haystack.includes(word)
                ){
                    score += 2;
                }

            });

            return {
                ...book,
                score
            };

        })
        .filter(book => book.score > 0)
        .sort(
            (a,b) =>
                b.score - a.score
        );

    return scored.slice(0,8);

}


/* =========================================================
   INTENT DETECTION
========================================================= */

function detectIntent(question){

    const q =
        normalize(question);

    if(
        q.includes("sadebooks ni nini") ||
        q.includes("sade books ni nini")
    ){
        return "about";
    }

    if(
        q.includes("vitabu") ||
        q.includes("kitabu") ||
        q.includes("book") ||
        q.includes("books")
    ){
        return "books";
    }

    if(
        q.includes("bei") ||
        q.includes("gharama") ||
        q.includes("shilingi") ||
        q.includes("tsh") ||
        q.includes("nunua")
    ){
        return "price";
    }

    if(
        q.includes("category") ||
        q.includes("categories") ||
        q.includes("aina")
    ){
        return "categories";
    }

    if(
        q.includes("contact") ||
        q.includes("mawasiliano") ||
        q.includes("wasiliana")
    ){
        return "contact";
    }

    if(
        q.includes("malipo") ||
        q.includes("payment")
    ){
        return "payments";
    }

    if(
        q.includes("free") ||
        q.includes("bure")
    ){
        return "free";
    }

    return "general";

}

async function askAI(question){

    if(!settings.apiKey){

        return {
            type:"local",
            text:localSadeBooksAnswer(
                question
            )
        };

    }

    if(
        settings.provider === "gemini"
    ){

        return await askGemini(
            question
        );

    }

    return await askOpenAICompatible(
        question
    );

}


/* =========================================================
   OPENAI / MISTRAL COMPATIBLE
========================================================= */

async function askOpenAICompatible(
    question
){

    const messages = [

        {
            role:"system",
            content:
                buildSystemPrompt(
                    question
                )
        },

        ...conversation.slice(-10)
            .map(item => ({
                role:item.role,
                content:item.content
            })),

        {
            role:"user",
            content:question
        }

    ];

    const response =
        await fetch(
            settings.endpoint,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json",
                    "Authorization":
                        "Bearer " +
                        settings.apiKey
                },
                body:
                    JSON.stringify({
                        model:
                            settings.model,
                        messages,
                        temperature:0.3,
                        max_tokens:1200
                    })
            }
        );

    if(!response.ok){

        const errorText =
            await response.text();

        throw new Error(
            "AI API Error " +
            response.status +
            ": " +
            errorText
        );

    }

    const data =
        await response.json();

    const content =
        data
            ?.choices?.[0]
            ?.message
            ?.content;

    if(!content){

        throw new Error(
            "AI haikurudisha jibu."
        );

    }

    return {
        type:"ai",
        text:content
    };

}


/* =========================================================
   GEMINI
========================================================= */

async function askGemini(question){

    const prompt =
        buildSystemPrompt(
            question
        ) +
        "\n\nUSER QUESTION:\n" +
        question;

    const url =
        "https://generativelanguage.googleapis.com/v1beta/models/" +
        encodeURIComponent(
            settings.model ||
            "gemini-2.0-flash"
        ) +
        ":generateContent?key=" +
        encodeURIComponent(
            settings.apiKey
        );

    const response =
        await fetch(
            url,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({
                        contents:[
                            {
                                parts:[
                                    {
                                        text:
                                            prompt
                                    }
                                ]
                            }
                        ],
                        generationConfig:{
                            temperature:.3,
                            maxOutputTokens:1200
                        }
                    })
            }
        );

    if(!response.ok){

        throw new Error(
            "Gemini API Error " +
            response.status
        );

    }

    const data =
        await response.json();

    const text =
        data
        ?.candidates?.[0]
        ?.content?.parts
        ?.map(p => p.text || "")
        .join("");

    if(!text){

        throw new Error(
            "Gemini haikurudisha jibu."
        );

    }

    return {
        type:"ai",
        text
    };

}

async function sendMessage(){

    const input =
        document.getElementById(
            "messageInput"
        );

    const question =
        input.value.trim();

    if(!question){
        return;
    }

    input.value = "";

    autoResize(input);

    hideWelcome();

    addUserMessage(
        question
    );

    conversation.push({
        role:"user",
        content:question
    });

    showTyping();

    document.getElementById(
        "sendButton"
    ).disabled = true;

    try{

        const result =
            await askAI(
                question
            );

        hideTyping();

        addAssistantMessage(
            result.text
        );

        conversation.push({
            role:"assistant",
            content:
                stripHtml(
                    result.text
                )
        });

        saveConversation();

    }catch(error){

        console.error(error);

        hideTyping();

        addAssistantMessage(`
⚠️ **Kuna tatizo la kuunganisha AI.**

Lakini SadeBooks Knowledge Engine bado inaweza
kutafuta vitabu na taarifa za SadeBooks.

Sababu:
${escapeHtml(error.message)}
`);

    }

    document.getElementById(
        "sendButton"
    ).disabled = false;

}

function formatResponse(text){

    let value =
        escapeHtml(
            text
        );

    value =
        value.replace(
            /```([\s\S]*?)```/g,
            "<pre>$1</pre>"
        );

    value =
        value.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );

    value =
        value.replace(
            /\n/g,
            "<br>"
        );

    value =
        value.replace(
            /https?:\/\/[^\s<]+/g,
            url => `
                <a
                    href="${url}"
                    target="_blank"
                    rel="noopener">
                    ${url}
                </a>
            `
        );

    return value;

}

function autoResize(textarea){

    textarea.style.height =
        "auto";

    textarea.style.height =
        Math.min(
            textarea.scrollHeight,
            150
        ) + "px";

}


function handleEnter(event){

    if(
        event.key === "Enter" &&
        !event.shiftKey
    ){

        event.preventDefault();

        sendMessage();

    }

}


function escapeHtml(value){

    return String(value || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function stripHtml(value){

    const div =
        document.createElement("div");

    div.innerHTML =
        value;

    return div.innerText;

}

function copyText(button){

    const bubble =
        button
        .closest(".message")
        .querySelector(".bubble");

    const text =
        bubble.innerText;

    navigator.clipboard
        .writeText(text)
        .then(() => {

            button.innerText =
                "✓ Copied";

            setTimeout(
                () =>
                    button.innerText =
                    "📋 Copy",
                1500
            );

        });

}

   TEXT TO SPEECH
========================================================= */

function speakText(button){

    const bubble =
        button
        .closest(".message")
        .querySelector(".bubble");

    const text =
        bubble.innerText;

    if(!("speechSynthesis" in window)){

        alert(
            "Browser yako haiungi mkono voice."
        );

        return;

    }

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(
            text
        );

    speech.lang = "sw-TZ";

    speech.rate = .95;

    speechSynthesis.speak(
        speech
    );

}

        );

    const label =
        document.getElementById(
            "statusText"
        );

    dot.classList.toggle(
        "offline",
        type === "offline"
    );

    label.textContent =
        text;

}


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle(
            "open"
        );

}


/* =========================================================
   SADEBOOKS
========================================================= */

function openSadeBooks(){

    window.open(
        settings.sadeBooksUrl ||
        DEFAULT_SADEBOOKS,
        "_blank"
    );

}


/* =========================================================
   SETTINGS MODAL
========================================================= */

function openSettings(){

    document
        .getElementById(
            "settingsModal"
        )
        .classList.add("show");

}


function closeSettings(){

    document
        .getElementById(
            "settingsModal"
        )
        .classList.remove("show");

}

/* =========================================================
   CLOSE MODAL OUTSIDE
========================================================= */

document
    .getElementById("settingsModal")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target === this
            ){
                closeSettings();
            }

        }
    );


/* =========================================================

========================================================= */

    () => {

        if(navigator.onLine){

            loadSadeBooks();

        }

    },
