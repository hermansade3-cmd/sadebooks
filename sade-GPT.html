<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SadeGPT - Mistral AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      height: 100vh;
    }

    .app {
      height: 100vh;
      max-width: 900px;
      margin: auto;
      display: flex;
      flex-direction: column;
      background: white;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: .8;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 85%;
      padding: 13px 16px;
      margin-bottom: 14px;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      margin-left: auto;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .ai {
      margin-right: auto;
      background: #e5e7eb;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .typing {
      font-style: italic;
      opacity: .65;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #ddd;
      background: white;
    }

    textarea {
      flex: 1;
      resize: none;
      height: 52px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #2563eb;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 0 20px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .clear {
      background: #dc2626;
      padding: 10px 15px;
      margin: 10px;
      border-radius: 10px;
    }

    @media (max-width: 600px) {
      .message {
        max-width: 92%;
      }

      .input-area {
        padding: 8px;
      }

      button {
        padding: 0 15px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>SadeGPT</h1>
    <p>Powered by Mistral AI</p>
  </header>

  <div id="chat">

    <div class="message ai">
      Habari! 👋
      Mimi ni SadeGPT powered by Mistral AI.

      Niulize swali lolote.
    </div>

  </div>

  <div class="input-area">

    <textarea
      id="message"
      placeholder="Andika ujumbe wako..."
    ></textarea>

    <button id="send">
      Tuma
    </button>

  </div>

</div>

<script>

/* =====================================================
   MISTRAL API CONFIGURATION
   ===================================================== */

/*
   WEKA API KEY YAKO MPYA HAPA

   Mfano:
   const MISTRAL_API_KEY = "AIza.....";

   Usichapishe faili hili kwenye GitHub ikiwa
   API key ipo ndani yake.
*/

const MISTRAL_API_KEY = "WEKA_API_KEY_YAKO_HAPA";


/* Mistral API endpoint */

const MISTRAL_URL =
  "https://api.mistral.ai/v1/chat/completions";


/* Model */

const MODEL =
  "mistral-small-latest";


/* =====================================================
   ELEMENTS
   ===================================================== */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("message");

const sendButton =
  document.getElementById("send");


/* =====================================================
   CONVERSATION MEMORY
   ===================================================== */

let messages = [

  {
    role: "system",

    content:
      `Wewe ni SadeGPT, AI assistant mwenye msaada.

Jibu kwa lugha ambayo mtumiaji ametumia.

Kama mtumiaji anauliza kwa Kiswahili,
jibu kwa Kiswahili.

Kuwa msaidizi, mwenye heshima,
na toa majibu yaliyo wazi na rahisi kueleweka.`
  }

];


/* =====================================================
   ADD MESSAGE TO SCREEN
   ===================================================== */

function addMessage(text, type) {

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent =
    text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

  return div;
}


/* =====================================================
   SEND MESSAGE
   ===================================================== */

async function sendMessage() {

  const text =
    input.value.trim();

  if (!text) return;


  /* Check API key */

  if (
    !MISTRAL_API_KEY ||
    MISTRAL_API_KEY ===
      "WEKA_API_KEY_YAKO_HAPA"
  ) {

    addMessage(
      "⚠️ Tafadhali weka Mistral API Key yako kwenye code.",
      "ai"
    );

    return;
  }


  /* Show user message */

  addMessage(
    text,
    "user"
  );


  /* Clear input */

  input.value = "";


  /* Disable button */

  sendButton.disabled =
    true;

  sendButton.textContent =
    "...";


  /* Add message to conversation */

  messages.push({

    role: "user",

    content: text

  });


  /* Typing indicator */

  const typing =
    addMessage(
      "SadeGPT anaandika...",
      "ai"
    );

  typing.classList.add(
    "typing"
  );


  try {

    const response =
      await fetch(
        MISTRAL_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "Authorization":
              "Bearer " +
              MISTRAL_API_KEY

          },

          body:
            JSON.stringify({

              model:
                MODEL,

              messages:
                messages,

              temperature:
                0.7,

              max_tokens:
                1500

            })

        }
      );


    const data =
      await response.json();


    /* Remove typing */

    typing.remove();


    /* Check error */

    if (!response.ok) {

      console.error(
        "Mistral Error:",
        data
      );

      let errorMessage =
        "Kuna tatizo kwenye Mistral API.";

      if (
        data &&
        data.message
      ) {

        errorMessage =
          data.message;

      }

      addMessage(
        "⚠️ " + errorMessage,
        "ai"
      );

      return;
    }


    /* Get AI response */

    const answer =
      data
        ?.choices
        ?.0
        ?.message
        ?.content;


    if (!answer) {

      addMessage(
        "Samahani, sijapata jibu.",
        "ai"
      );

      return;
    }


    /* Add AI response */

    addMessage(
      answer,
      "ai"
    );


    /* Save conversation */

    messages.push({

      role: "assistant",

      content: answer

    });


  } catch (error) {

    console.error(
      error
    );


    typing.remove();


    addMessage(
      "⚠️ Imeshindikana kuwasiliana na Mistral API. Hakikisha una internet na API key yako ni sahihi.",
      "ai"
    );

  } finally {

    sendButton.disabled =
      false;

    sendButton.textContent =
      "Tuma";

    input.focus();

  }

}


/* =====================================================
   SEND BUTTON
   ===================================================== */

sendButton.addEventListener(
  "click",
  sendMessage
);


/* =====================================================
   ENTER TO SEND
   ===================================================== */

input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);

</script>

</body>
</html>
